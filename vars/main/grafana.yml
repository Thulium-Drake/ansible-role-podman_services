podman_volumes_grafana:
  grafana:
    - 'grafana'

podman_service_container_grafana_volumes:
  - "{{ service['name'] }}:/var/lib/grafana:Z"

podman_service_containers_grafana:
  grafana:
    grafana:
      image: 'docker.io/grafana/grafana:latest'
      ports:
        - "{{ grafana_listen_uri }}:3000"  # If not using traefik
      env: "{{ grafana_container_env }}"
      labels:
        traefik.enable: true
        traefik.http.routers.grafana.rule: "Host(`grafana.{{ traefik_domain }}`)"
        traefik.http.routers.grafana.tls: "true"
        traefik.http.services.grafana.loadbalancer.server.port: '3000'
      volume: "{{ grafana_volumes + podman_service_container_grafana_volumes }}"
      network: "{{ ['influxdb-backend.network'] + (traefik_disabled | ternary([], ['traefik-backend'])) }}"
